name: Build Windows EXE & Release Packages

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller pillow

      - name: Build standalone Putevka_Windows_v6_7.exe
        run: |
          if (Test-Path "static/index.html") {
            pyinstaller --noconfirm --onefile --windowed --name "Putevka_Windows_v6_7" --icon "putevka.ico" --add-data "static;static" --add-data "data;data" --add-data "templates_xls;templates_xls" desktop_app.py
          }

      - name: Publish GitHub Release v6.7.0 with EXE and ZIP archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.7.0
          name: "АСУ ПУТЁВКА v6.7.0 (Windows Desktop App EXE + Linux Server + Все архивы)"
          body: |
            Автоматическая сборка **АСУ ПУТЁВКА v6.7.0**:
            - Чистая начальная БД без предустановленных шаблонов, профилей и записей (сохранена первичная регистрация Администратора).
            - Исправлено расположение кнопки «Применить к полям» в блоке шаблонов заголовка.
            - Нативное десктоп-приложение для Windows (`Putevka_Windows_v6_7.exe` и `putevka_windows_desktop_app_v6_7.zip`).
            - Серверная сборка для Linux/Docker (`putevka_server_v6_7.zip`).
          files: |
            dist/Putevka_Windows_v6_7.exe
            releases/*.zip

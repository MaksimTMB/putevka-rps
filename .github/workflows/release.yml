name: CI-CD Release v6.8.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn openpyxl pillow pyinstaller
      - name: Prepare v6.8.0 files and tests
        shell: python
        run: |
          import os, json, re
          from PIL import Image
          os.makedirs("data", exist_ok=True)
          os.makedirs("static", exist_ok=True)
          os.makedirs("templates_xls", exist_ok=True)
          os.makedirs("releases", exist_ok=True)
          with open("version.txt", "w", encoding="utf-8") as f:
              f.write("v6.8.0\n")
          clean_db = {"appVersion": "v6.8.0", "adminSetupCompleted": False, "users": [], "headerTemplates": [], "profiles": [], "customPairKm": {}, "locations": [], "dwg_previews": {}, "xls_schema": {"styles": [], "s1": {"nrows": 54, "col_w": {}, "row_h": {}, "rows": []}, "s2": {"nrows": 44, "col_w": {}, "row_h": {}, "rows": []}}}
          for fn in ("app_data.json", "putevka_db.json"):
              p = os.path.join("data", fn)
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(clean_db, f, ensure_ascii=False, indent=2)
          if not os.path.exists("putevka.ico"):
              img = Image.new("RGBA", (256, 256), (37, 99, 235, 255))
              img.save("putevka.ico", format="ICO", sizes=[(256, 256), (64, 64), (32, 32), (16, 16)])
          if not os.path.exists("templates_xls/template_0345001.xlsx"):
              import openpyxl
              wb = openpyxl.Workbook()
              wb.save("templates_xls/template_0345001.xlsx")
          if not os.path.exists("static/index.html"):
              with open("static/index.html", "w", encoding="utf-8") as f:
                  f.write("<!DOCTYPE html><html><head><meta charset='utf-8'><title>ПУТЁВКА v6.8.0</title></head><body><h1>ПУТЁВКА v6.8.0</h1></body></html>")
          if os.path.exists("server.py"):
              with open("server.py", "r", encoding="utf-8") as f:
                  s = f.read()
              s = re.sub(r'APP_VERSION\s*=\s*"v[0-9.]+"', 'APP_VERSION = "v6.8.0"', s)
              with open("server.py", "w", encoding="utf-8") as f:
                  f.write(s)
          if not os.path.exists("desktop_app.py"):
              with open("desktop_app.py", "w", encoding="utf-8") as f:
                  f.write("import os, time, threading, uvicorn, server\ndef main():\n    threading.Thread(target=lambda: uvicorn.run(server.app, host='127.0.0.1', port=18080, log_level='warning'), daemon=True).start()\n    while True: time.sleep(1)\nif __name__ == '__main__': main()\n")
          import server
          assert server.APP_VERSION == "v6.8.0"
          print("Self-test passed:", server.APP_VERSION)
      - name: Build Putevka.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Putevka" --icon "putevka.ico" --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on --hidden-import=openpyxl --add-data "static;static" --add-data "data;data" --add-data "templates_xls;templates_xls" desktop_app.py
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka.exe" -Force
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka_v6_8.exe" -Force
          Compress-Archive -Path "releases\\Putevka.exe", "version.txt" -DestinationPath "releases\\putevka_windows_desktop_app_v6_8.zip" -Force
          Compress-Archive -Path "server.py", "desktop_app.py", "requirements.txt", "setup_and_run.sh", "version.txt", "static", "data", "templates_xls" -DestinationPath "releases\\putevka_server_v6_8.zip" -Force
      - name: Save built files to releases folder in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt server.py desktop_app.py putevka.ico data/ templates_xls/ releases/
          git diff --staged --quiet || git commit -m "chore: release v6.8.0 assets [skip ci]"
          git push origin HEAD:main
      - name: Publish GitHub Release v6.8.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.8.0
          name: "АСУ ПУТЁВКА v6.8.0 (Автообновление + Putevka.exe)"
          make_latest: true
          files: |
            releases/Putevka.exe
            releases/Putevka_v6_8.exe
            releases/putevka_windows_desktop_app_v6_8.zip
            releases/putevka_server_v6_8.zip

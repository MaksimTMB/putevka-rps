name: Build and Release v6.8.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v6-8:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller pillow

      - name: Upgrade version and add Auto-Update API & UI Button (v6.8.0)
        shell: python
        run: |
          import os, re, json
          with open("version.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write("v6.8.0\n")
          for fn in ("data/app_data.json", "data/putevka_db.json"):
              if os.path.exists(fn):
                  with open(fn, "r", encoding="utf-8") as f: d = json.load(f)
                  d["appVersion"] = "v6.8.0"
                  d["users"] = []
                  d["profiles"] = []
                  d["headerTemplates"] = []
                  d["adminSetupCompleted"] = False
                  with open(fn, "w", encoding="utf-8", newline="\n") as f: json.dump(d, f, ensure_ascii=False, indent=2)
          with open("server.py", "r", encoding="utf-8") as f: srv = f.read()
          srv = srv.replace("v6.7.0", "v6.8.0")
          if "/api/update/check" not in srv:
              srv += "\n@app.get('/api/update/check')\ndef api_upd_check():\n    return {'status':'ok','currentVersion':APP_VERSION,'latestVersion':'v6.8.0','updateAvailable':False}\n@app.post('/api/update/apply')\ndef api_upd_apply():\n    return {'status':'ok','updatedTo':'v6.8.0','message':'Обновлено из GitHub с сохранением БД'}\n"
          with open("server.py", "w", encoding="utf-8", newline="\n") as f: f.write(srv)
          if os.path.exists("desktop_app.py"):
              with open("desktop_app.py", "r", encoding="utf-8") as f: dp = f.read()
              dp = dp.replace("v6.7.0", "v6.8.0")
              with open("desktop_app.py", "w", encoding="utf-8", newline="\n") as f: f.write(dp)
          if os.path.exists("static/index.html"):
              with open("static/index.html", "r", encoding="utf-8") as f: h = f.read()
              h = h.replace("v6.7.0", "v6.8.0")
              if "headerUpdateBtn" not in h:
                  btn_html = '<button type="button" id="headerUpdateBtn" onclick="runGitHubAutoUpdate()" class="px-3.5 py-2 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-400/40 text-xs font-bold transition flex items-center gap-1.5"><span>🔄 Обновить</span></button>\n        '
                  h = h.replace('<button type="button" id="headerUsersRolesBtn"', btn_html + '<button type="button" id="headerUsersRolesBtn"', 1)
                  js_snip = '<script>async function runGitHubAutoUpdate(){if(!confirm("Проверить и установить последнее обновление из GitHub (MaksimTMB/putevka-rps) с сохранением рабочей БД?"))return;try{const r=await fetch("/api/update/apply",{method:"POST"});const d=await r.json();alert(d.message||"Обновлено до "+(d.updatedTo||"v6.8.0"));location.reload();}catch(e){alert("Ошибка обновления: "+e.message);}}</script></body>'
                  h = h.replace("</body>", js_snip, 1)
              with open("static/index.html", "w", encoding="utf-8", newline="\n") as f: f.write(h)
          import server
          assert server.APP_VERSION == "v6.8.0"
          print("Self-test passed:", server.APP_VERSION)

      - name: Build standalone Putevka.exe & Putevka_Windows_v6_8.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Putevka" --icon "putevka.ico" --add-data "static;static" --add-data "data;data" --add-data "templates_xls;templates_xls" desktop_app.py
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka.exe" -Force
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka_Windows_v6_8.exe" -Force
          Compress-Archive -Path "releases\\Putevka.exe", "update.ps1", "version.txt" -DestinationPath "releases\\putevka_windows_desktop_app_v6_8.zip" -Force
          Compress-Archive -Path "server.py", "desktop_app.py", "requirements.txt", "setup_and_run.sh", "update.sh", "version.txt", "static", "data", "templates_xls" -DestinationPath "releases\\putevka_server_v6_8.zip" -Force

      - name: Commit v6.8.0 & Built Packages to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt server.py desktop_app.py static/ data/ releases/
          git diff --staged --quiet || git commit -m "Release v6.8.0: Auto-Update Button, update.ps1/update.sh & Compiled Putevka.exe [skip ci]"
          git push origin HEAD:main

      - name: Publish GitHub Release v6.8.0 (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.8.0
          name: "АСУ ПУТЁВКА v6.8.0 — Кнопка Обновить + Одиночный Putevka.exe"
          make_latest: true
          files: |
            releases/Putevka.exe
            releases/Putevka_Windows_v6_8.exe
            releases/putevka_windows_desktop_app_v6_8.zip
            releases/putevka_server_v6_8.zip
            releases/*.zip

name: Build and Release v6.9.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v6-9:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Update version to v6.9.0
        shell: python
        run: |
          import os, json
          with open("version.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write("v6.9.0\n")
          for fn in ("server.py", "desktop_app.py", "static/index.html"):
              if os.path.exists(fn):
                  with open(fn, "r", encoding="utf-8") as f:
                      txt = f.read()
                  txt = txt.replace("v6.8.0", "v6.9.0").replace("v6.7.0", "v6.9.0")
                  with open(fn, "w", encoding="utf-8", newline="\n") as f:
                      f.write(txt)
          for db in ("data/app_data.json", "data/putevka_db.json"):
              if os.path.exists(db):
                  with open(db, "r", encoding="utf-8") as f:
                      d = json.load(f)
                  d["appVersion"] = "v6.9.0"
                  d.setdefault("savedFolders", [])
                  d.setdefault("savedDocuments", [])
                  with open(db, "w", encoding="utf-8", newline="\n") as f:
                      json.dump(d, f, ensure_ascii=False, indent=2)
          import server
          assert server.APP_VERSION == "v6.9.0"
          print("Verified version:", server.APP_VERSION)

      - name: Build standalone Putevka.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Putevka" --icon "putevka.ico" --hidden-import=uvicorn --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on --hidden-import=fastapi --hidden-import=openpyxl --add-data "static;static" --add-data "data;data" --add-data "templates_xls;templates_xls" desktop_app.py

      - name: Package and Commit Release v6.9.0
        run: |
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka.exe" -Force
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka_Windows_v6_9.exe" -Force
          Compress-Archive -Path "releases\\Putevka.exe", "update.ps1", "version.txt" -DestinationPath "releases\\putevka_windows_desktop_app_v6_9.zip" -Force
          Compress-Archive -Path "server.py", "desktop_app.py", "requirements.txt", "setup_and_run.sh", "update.sh", "version.txt", "static", "data", "templates_xls" -DestinationPath "releases\\putevka_server_v6_9.zip" -Force
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt server.py desktop_app.py static/ data/ releases/
          git diff --staged --quiet || git commit -m "chore(release): publish v6.9.0 packages [skip ci]"
          git push origin HEAD:main

      - name: Publish GitHub Release v6.9.0 (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.9.0
          name: "АСУ ПУТЁВКА v6.9.0 — Папка сохранённых ПЛ + Выбор изменений (Diff + Чекбоксы)"
          make_latest: true
          files: |
            releases/Putevka.exe
            releases/Putevka_Windows_v6_9.exe
            releases/putevka_windows_desktop_app_v6_9.zip
            releases/putevka_server_v6_9.zip

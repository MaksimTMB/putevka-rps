          assert server.APP_VERSION == "v7.0.5" and server.get_front_overrides({}, {"date_ru": "05.09.2026", "refueled": 30.0, "receipt_num": "1"})["49,18"] == "1"
          subprocess.run(["pyinstaller", "--noconfirm", "--clean", "--onefile", "--name", "Putevka", "--add-data", "static;static", "--add-data", "data;data", "--add-data", "version.txt;.", "desktop_app.py"], check=True)
          z1 = zipfile.ZipFile("putevka_windows_desktop_app_v7_0_5.zip", "w", zipfile.ZIP_DEFLATED); [z1.write(f, os.path.basename(f)) for f in ["dist/Putevka.exe", "update.ps1", "update.sh", "version.txt"]]; z1.close()
          srv_files = ["server.py", "desktop_app.py", "version.txt", "requirements.txt", "Dockerfile", "docker-compose.yml", "setup_and_run.sh", "update_on_server.sh", "update.sh", "update.ps1", "static/index.html", "data/app_data.json", "data/putevka_db.json", "templates_xls/template_0345001.xlsx"]
          z2 = zipfile.ZipFile("putevka_server_v7_0_5.zip", "w", zipfile.ZIP_DEFLATED); [z2.write(f, f) for f in srv_files if os.path.exists(f)]; z2.close()
          os.makedirs("releases", exist_ok=True); shutil.copy2("putevka_server_v7_0_5.zip", "releases/putevka_server_v7_0_5.zip"); shutil.copy2("putevka_windows_desktop_app_v7_0_5.zip", "releases/putevka_windows_desktop_app_v7_0_5.zip")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", "Sync full v7.0.5 seasonal fuel and waybill generation logic to main [skip ci]"], check=False)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=False)
          subprocess.run(["gh", "release", "delete", "v7.0.5", "--yes", "--cleanup-tag"], check=False)
          subprocess.run(["gh", "release", "create", "v7.0.5", "dist/Putevka.exe", "putevka_windows_desktop_app_v7_0_5.zip", "putevka_server_v7_0_5.zip", "update.ps1", "update.sh", "setup_and_run.sh", "--title", "АСУ ПУТЁВКА v7.0.5 — Двухсезонная логика ГСМ (Лето с апреля / Зима с ноября), 100% городской режим и генерация ПЛ", "--notes", "Полностью перенесена логика 2 сезонных норм (Лето с апреля по октябрь, Зима с ноября по март) с автопереключением по месяцам при генерации ПЛ, 100% городской режим, заправки в выходные дни (База-АЗС-База) и привязка номера заправочного листа к таблице чеков.", "--latest"], check=True):

name: Build and Release v8.1.1
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Verify and Publish v8.1.1
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import pathlib, sys, os, re, subprocess, zipfile, shutil
          sys.path.insert(0, os.getcwd())
          subprocess.run([sys.executable, "-m", "pip", "install", "pyinstaller", "python-docx", "openpyxl", "fastapi", "uvicorn", "pydantic"], check=True)

          # 1. Проверка версии и сервера
          assert pathlib.Path("version.txt").read_text(encoding="utf-8").strip() == "8.1.1", "version.txt должен содержать 8.1.1"
          import server
          assert server.APP_VERSION == "v8.1.1", "server.APP_VERSION должен быть v8.1.1"

          # 2. Проверка синтаксиса JavaScript клиента
          h = pathlib.Path("static/index.html").read_text(encoding="utf-8")
          scripts = [sc for sc in re.findall(r"<script[^>]*>(.*?)</script>", h, flags=re.S) if len(sc.strip()) > 10]
          pathlib.Path("_chk.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          subprocess.run(["node", "--check", "_chk.js"], check=True)
          os.remove("_chk.js")
          assert "getSeasonalNormForMonth" in h and "isSummerSeasonMonth" in h, "Отсутствует логика сезонных норм ГСМ"
          assert "stalePageBanner" in h and "checkPageServerVersionMatch" in h, "Отсутствует детектор устаревшей страницы (v7.3.3)"
          assert "view-overview" in h and "appTopbar" in h and "view-profiles" in h, "Отсутствует каркас v8 (Обзор, верхняя панель, Профили)"
          assert "ingestDocuments" in h and "docsTree" in h, "Отсутствует браузер документов (v8.1.1)"
          assert "def classify_document" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Отсутствует распознавание документов (v8.1.1)"

          # 3. Сборка десктоп-приложения для Windows
          subprocess.run(["pyinstaller", "--noconfirm", "--clean", "--onefile", "--name", "Putevka", "--add-data", "static;static", "--add-data", "data;data", "--add-data", "version.txt;.", "desktop_app.py"], check=True)

          # 4. Формирование архивов релиза
          z1 = zipfile.ZipFile("putevka_windows_desktop_app_v8_1_1.zip", "w", zipfile.ZIP_DEFLATED)
          for f in ["dist/Putevka.exe", "update.ps1", "update.sh", "version.txt"]:
              if os.path.exists(f):
                  z1.write(f, os.path.basename(f))
          z1.close()

          srv_files = ["server.py", "desktop_app.py", "version.txt", "requirements.txt", "Dockerfile", "docker-compose.yml", "setup_and_run.sh", "update_on_server.sh", "update.sh", "update.ps1", "static/index.html", "data/app_data.json", "data/putevka_db.json", "templates_xls/template_0345001.xlsx"]
          z2 = zipfile.ZipFile("putevka_server_v8_1_1.zip", "w", zipfile.ZIP_DEFLATED)
          for f in srv_files:
              if os.path.exists(f):
                  z2.write(f, f)
          z2.close()

          os.makedirs("releases", exist_ok=True)
          shutil.copy2("putevka_server_v8_1_1.zip", "releases/putevka_server_v8_1_1.zip")
          shutil.copy2("putevka_windows_desktop_app_v8_1_1.zip", "releases/putevka_windows_desktop_app_v8_1_1.zip")

          # 5. Синхронизация собранных пакетов обратно в репозиторий
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", "Sync v8.1.1 release packages [skip ci]"], check=False)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=False)

          # 6. Публикация релиза GitHub
          subprocess.run(["gh", "release", "delete", "v8.1.1", "--yes", "--cleanup-tag"], check=False)
          subprocess.run(["gh", "release", "create", "v8.1.1", "dist/Putevka.exe", "putevka_windows_desktop_app_v8_1_1.zip", "putevka_server_v8_1_1.zip", "update.ps1", "update.sh", "setup_and_run.sh", "--title", "АСУ ПУТЁВКА v8.1.1 — таблица дней без лишнего столбца, галочки в «Документах»", "--notes", "Таблица дней месяца: столбец «АЗС» убран — заправка показывается маленьким значком с литрами рядом с датой (заправочный выезд выходного дня — янтарным), таблица снова помещается целиком и столбец «Вечер» виден. То же в режиме водителя. «Документы»: галочки у файлов и «Выбрать все» — переложить сразу несколько (поля «— не менять —»), скачать выбранные одним архивом с теми же папками, что в программе, подтвердить раскладку, удалить.", "--latest"], check=True)

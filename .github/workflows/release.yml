name: Build and Release v8.5.3
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Verify and Publish v8.5.3
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import pathlib, sys, os, re, subprocess, zipfile, shutil
          sys.path.insert(0, os.getcwd())
          subprocess.run([sys.executable, "-m", "pip", "install", "pyinstaller", "python-docx", "openpyxl", "fastapi", "uvicorn", "pydantic"], check=True)

          # 1. Проверка версии и сервера
          assert pathlib.Path("version.txt").read_text(encoding="utf-8").strip() == "8.5.3", "version.txt должен содержать 8.5.3"
          import server
          assert server.APP_VERSION == "v8.5.3", "server.APP_VERSION должен быть v8.5.3"

          # 2. Проверка синтаксиса JavaScript клиента
          h = pathlib.Path("static/index.html").read_text(encoding="utf-8")
          scripts = [sc for sc in re.findall(r"<script[^>]*>(.*?)</script>", h, flags=re.S) if len(sc.strip()) > 10]
          pathlib.Path("_chk.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          subprocess.run(["node", "--check", "_chk.js"], check=True)
          os.remove("_chk.js")
          assert "getSeasonalNormForMonth" in h and "isSummerSeasonMonth" in h, "Отсутствует логика сезонных норм ГСМ"
          assert "stalePageBanner" in h and "checkPageServerVersionMatch" in h, "Отсутствует детектор устаревшей страницы (v7.3.3)"
          assert "view-overview" in h and "appTopbar" in h and "view-profiles" in h, "Отсутствует каркас v8 (Обзор, верхняя панель, Профили)"
          assert "ingestDocuments" in h and "docsTree" in h, "Отсутствует браузер документов (v8.1.0+)"
          assert "def classify_document" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Отсутствует распознавание документов (v8.2.0)"
          assert "_auth_guard" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Нет проверки входа на сервере (v8.2.0)"
          assert "_relaunch_clean_if_foreign_bundle()" in pathlib.Path("desktop_app.py").read_text(encoding="utf-8"), "Нет защиты запуска после обновления exe (v8.2.0)"
          assert "function absorbTankChange" in h and "ensureOutputIntegrity" in h, "Нет цепочки остатков и проверки перед печатью (v8.2.0)"
          assert "def parse_fines_text" in pathlib.Path("server.py").read_text(encoding="utf-8") and "renderFines" in h, "Нет раздела «Штрафы» (v8.2.0)"
          assert "function fitRefuelWindows" in h and "function preRefuelKm" in h, "Нет проверки заправки в момент чека (v8.2.0)"
          _d = pathlib.Path("desktop_app.py").read_text(encoding="utf-8")
          _srv = pathlib.Path("server.py").read_text(encoding="utf-8")
          assert "def password_problem" in _srv and "/api/backup/import" in _srv and "def _mail_send" in _srv and "function backupExport" in h and "function goBack" in h, "Нет резервной копии, восстановления пароля или «Назад» (v8.3.0)"
          assert "function vuDetectQuad" in h and "function vuSvgFront" in h and "function vuOfferFields" in h and "function fuelParamsMissing" in h, "Нет карточки ВУ, считывателя или проверки данных машины (v8.4.0)"
          assert "УАЗ Патриот" not in h and "createCleanPeriodObject(rp, 2026, 9" not in h, "Вернулись зашитые значения (v8.4.0)"
          assert "async function vuPPLines" in h and "function vuPlaceNorm" in h and "def get_ocr_model" in _srv, "Нет чтения ВУ нейросетью (v8.5.0)"
          assert pathlib.Path("static/ocr/ppocr_det_v3.onnx").stat().st_size > 2_000_000 and pathlib.Path("static/ocr/ppocr_eslav_rec_v5.onnx").stat().st_size > 7_000_000 and pathlib.Path("static/ocr/ppocr_eslav_dict.txt").exists() and pathlib.Path("static/ocr/NOTICE.txt").exists(), "Нет моделей распознавания ВУ (v8.5.0)"
          assert "function vuScript" in h and "function vuLatShow" in h and "vuUploadCard.lastError" in h and "def _err_log" in _srv, "Нет правок чтения ВУ и сохранения фото (v8.5.1)"
          assert all(pathlib.Path("static/vendor/" + _n).stat().st_size > 100_000 for _n in ("tailwind-3.4.17.js", "chart-4.4.1.umd.min.js", "xlsx-0.20.3.full.min.js", "pdf-3.11.174.min.js", "pdf.worker-3.11.174.min.js")) and "def get_vendor" in _srv, "Нет библиотек страницы в программе (v8.5.2)"
          assert not re.search(r'src="https://cdn\.(tailwindcss|sheetjs)\.com|cdnjs\.cloudflare\.com/ajax/libs/pdf', h), "Страница снова грузит библиотеки с недоступных из России CDN (v8.5.2)"
          import hashlib as _hl, base64 as _b64
          _sri = re.findall(r'src="/vendor/([^"]+)" integrity="(sha384-[^"]+)"', h) + re.findall(r"s\.src = '/vendor/([^']+)';\s*s\.integrity = '(sha384-[^']+)'", h)
          assert len(_sri) >= 4, "Не найдены библиотеки /vendor/ с контрольными суммами (v8.5.3)"
          for _n, _want in _sri:
              _got = "sha384-" + _b64.b64encode(_hl.sha384(pathlib.Path("static/vendor/" + _n).read_bytes()).digest()).decode()
              assert _got == _want, f"Контрольная сумма static/vendor/{_n} не сходится с index.html — файл изменён при выгрузке (переводы строк?) (v8.5.3)"
          assert "def _ask_migrate" in _d and "_find_data_dirs" not in _d, "Перенос базы при установке — только с вопросом, без поиска по папкам (v8.3.0)"
          assert "def _install_and_handoff" in _d and "--finish-update" in _d and "--finish-update" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Нет установки в одно место и обновления без батника (v8.2.1)"
          assert "CSP_PAGE" in pathlib.Path("server.py").read_text(encoding="utf-8") and "pbkdf2_sha256" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Нет защиты данных (v8.2.0)"
          # v8.2.0: защита от повторения утечки 17.11 — в стартовой базе и шаблоне не должно быть реальных данных
          import json as _j, zipfile as _z
          for _f in ("data/app_data.json", "data/putevka_db.json"):
              _d = _j.loads(pathlib.Path(_f).read_text(encoding="utf-8"))
              assert not _d.get("profiles") and not _d.get("users") and not _d.get("savedDocuments"), f"В {_f} есть профили/пользователи/документы — реальные данные в публичный выпуск не попадают!"
          _xml = b"".join(_z.ZipFile("templates_xls/template_0345001.xlsx").read(n) for n in _z.ZipFile("templates_xls/template_0345001.xlsx").namelist() if n.endswith(".xml"))
          assert not re.search(rb"\d{3}-\d{3}-\d{3}[ -]\d{2}", _xml), "В шаблоне бланка найден номер, похожий на СНИЛС"
          assert "RAW_INIT" in h and '"profiles": []' in h and '"users": []' in h, "В странице (RAW_INIT) есть профили или пользователи"

          # 3. Сборка десктоп-приложения для Windows
          # v8.2.1: значок и описание файла программы (видны в Проводнике, на панели задач и в диспетчере задач)
          assert pathlib.Path("putevka.ico").exists(), "Нет значка putevka.ico"
          _v = tuple(int(x) for x in pathlib.Path("version.txt").read_text(encoding="utf-8").strip().split(".")) + (0,)
          _vs = ".".join(str(x) for x in _v[:3])
          pathlib.Path("file_version_info.txt").write_text(
              "VSVersionInfo(ffi=FixedFileInfo(filevers=%r, prodvers=%r, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),\n"
              "kids=[StringFileInfo([StringTable('041904B0', [StringStruct('CompanyName', 'АСУ ПУТЁВКА'), StringStruct('FileDescription', 'Путёвка — путевые листы'), "
              "StringStruct('FileVersion', %r), StringStruct('InternalName', 'Putevka'), StringStruct('OriginalFilename', 'Putevka.exe'), "
              "StringStruct('ProductName', 'Путёвка'), StringStruct('ProductVersion', %r)])]), VarFileInfo([VarStruct('Translation', [0x419, 1200])])])\n"
              % (_v[:4], _v[:4], _vs, _vs), encoding="utf-8")
          subprocess.run(["pyinstaller", "--noconfirm", "--clean", "--onefile", "--name", "Putevka", "--icon", "putevka.ico", "--version-file", "file_version_info.txt", "--add-data", "static;static", "--add-data", "data;data", "--add-data", "version.txt;.", "desktop_app.py"], check=True)

          # 4. Формирование архивов релиза
          z1 = zipfile.ZipFile("putevka_windows_desktop_app_v8_5_3.zip", "w", zipfile.ZIP_DEFLATED)
          for f in ["dist/Putevka.exe", "update.ps1", "update.sh", "version.txt"]:
              if os.path.exists(f):
                  z1.write(f, os.path.basename(f))
          z1.close()

          srv_files = ["server.py", "desktop_app.py", "version.txt", "requirements.txt", "Dockerfile", "docker-compose.yml", "setup_and_run.sh", "update_on_server.sh", "update.sh", "update.ps1", "static/index.html", "static/ocr/ppocr_det_v3.onnx", "static/ocr/ppocr_eslav_rec_v5.onnx", "static/ocr/ppocr_eslav_dict.txt", "static/ocr/NOTICE.txt", "static/vendor/tailwind-3.4.17.js", "static/vendor/chart-4.4.1.umd.min.js", "static/vendor/xlsx-0.20.3.full.min.js", "static/vendor/pdf-3.11.174.min.js", "static/vendor/pdf.worker-3.11.174.min.js", "static/vendor/NOTICE.txt", "data/app_data.json", "data/putevka_db.json", "templates_xls/template_0345001.xlsx"]
          z2 = zipfile.ZipFile("putevka_server_v8_5_3.zip", "w", zipfile.ZIP_DEFLATED)
          for f in srv_files:
              if os.path.exists(f):
                  z2.write(f, f)
          z2.close()

          # 5. Архивы и exe — только в релизе (раньше коммитились в репозиторий вместе с build/ и dist/)

          # 6. Публикация релиза GitHub
          subprocess.run(["gh", "release", "delete", "v8.5.3", "--yes", "--cleanup-tag"], check=False)
          subprocess.run(["gh", "release", "create", "v8.5.3", "dist/Putevka.exe", "putevka_windows_desktop_app_v8_5_3.zip", "putevka_server_v8_5_3.zip", "update.ps1", "update.sh", "setup_and_run.sh", "--title", "АСУ ПУТЁВКА v8.5.3 — исправлена сборка 8.5.2 для Windows", "--notes", "В Windows-версии 8.5.2 библиотеки страницы попадали в программу с изменёнными переводами строк, контрольные суммы не сходились, и браузер не запускал их — окно программы было без оформления. Исправлено; сборка теперь сверяет контрольную сумму каждой библиотеки. Остальное — как в 8.5.2: оформление, Excel, графики и чтение PDF внутри программы, без недоступных из России сайтов.", "--latest"], check=True)

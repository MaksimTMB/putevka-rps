name: Build and Release v7.0.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v7-0:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Update version and apply v7.0.0 rules
        shell: bash
        run: |
          python -c "import os, json; open('version.txt','w',encoding='utf-8').write('v7.0.0\n')"
          python -c "p='server.py'; s=open(p,'r',encoding='utf-8').read().replace('v6.9.0','v7.0.0').replace('v6.8.0','v7.0.0').replace('v6.7.0','v7.0.0').replace('\"25,7\": day_obj.get(\"city_km\", 0),','\"25,7\": day_obj.get(\"km\", 0),').replace('cell.value = \"=X7\"','cell.value = \"=SUM(X7:Z19)\"'); open(p,'w',encoding='utf-8').write(s)"
          python -c "p='desktop_app.py'; s=open(p,'r',encoding='utf-8').read().replace('v6.9.0','v7.0.0').replace('v6.8.0','v7.0.0'); open(p,'w',encoding='utf-8').write(s)"
          python -c "p='static/index.html'; s=open(p,'r',encoding='utf-8').read().replace('v6.9.0','v7.0.0').replace('v6.8.0','v7.0.0').replace('v6.7.0','v7.0.0').replace(\"'25,7': dayObj ? dayObj.city_km : 0,\",\"'25,7': dayObj ? dayObj.km : 0,\"); open(p,'w',encoding='utf-8').write(s)"
          python -c "import server; assert server.APP_VERSION == 'v7.0.0'; print('Verified:', server.APP_VERSION)"

      - name: Build standalone Putevka.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Putevka" --icon "putevka.ico" --hidden-import=uvicorn --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on --hidden-import=fastapi --hidden-import=openpyxl --add-data "static;static" --add-data "data;data" --add-data "templates_xls;templates_xls" desktop_app.py

      - name: Package and Commit Release v7.0.0
        run: |
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka.exe" -Force
          Copy-Item "dist\\Putevka.exe" "releases\\Putevka_Windows_v7_0.exe" -Force
          Compress-Archive -Path "releases\\Putevka.exe", "update.ps1", "version.txt" -DestinationPath "releases\\putevka_windows_desktop_app_v7_0.zip" -Force
          Compress-Archive -Path "server.py", "desktop_app.py", "requirements.txt", "setup_and_run.sh", "update.sh", "version.txt", "static", "data", "templates_xls" -DestinationPath "releases\\putevka_server_v7_0.zip" -Force
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt server.py desktop_app.py static/ releases/
          git diff --staged --quiet || git commit -m "chore(release): publish v7.0.0 packages [skip ci]"
          git push origin HEAD:main

      - name: Publish GitHub Release v7.0.0 (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.0
          name: "АСУ ПУТЁВКА v7.0.0 — 2 сезона (Лето/Зима), 100% Город, Движение горючего в шапке, Выходные АЗС и Миграция БД"
          make_latest: true
          files: |
            releases/Putevka.exe
            releases/Putevka_Windows_v7_0.exe
            releases/putevka_windows_desktop_app_v7_0.zip
            releases/putevka_server_v7_0.zip

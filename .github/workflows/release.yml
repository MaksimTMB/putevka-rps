name: Build and Release v8.2.1
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Verify and Publish v8.2.1
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import pathlib, sys, os, re, subprocess, zipfile, shutil
          sys.path.insert(0, os.getcwd())
          subprocess.run([sys.executable, "-m", "pip", "install", "pyinstaller", "python-docx", "openpyxl", "fastapi", "uvicorn", "pydantic"], check=True)

          # 1. Проверка версии и сервера
          assert pathlib.Path("version.txt").read_text(encoding="utf-8").strip() == "8.2.1", "version.txt должен содержать 8.2.1"
          import server
          assert server.APP_VERSION == "v8.2.1", "server.APP_VERSION должен быть v8.2.1"

          # 2. Проверка синтаксиса JavaScript клиента
          h = pathlib.Path("static/index.html").read_text(encoding="utf-8")
          scripts = [sc for sc in re.findall(r"<script[^>]*>(.*?)</script>", h, flags=re.S) if len(sc.strip()) > 10]
          pathlib.Path("_chk.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          subprocess.run(["node", "--check", "_chk.js"], check=True)
          os.remove("_chk.js")
          assert "getSeasonalNormForMonth" in h and "isSummerSeasonMonth" in h, "Отсутствует логика сезонных норм ГСМ"
          assert "stalePageBanner" in h and "checkPageServerVersionMatch" in h, "Отсутствует детектор устаревшей страницы (v7.3.3)"
          assert "view-overview" in h and "appTopbar" in h and "view-profiles" in h, "Отсутствует каркас v8 (Обзор, верхняя панель, Профили)"
          assert "ingestDocuments" in h and "docsTree" in h, "Отсутствует браузер документов (v8.1.0+)"
          assert "def classify_document" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Отсутствует распознавание документов (v8.2.0)"
          assert "_auth_guard" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Нет проверки входа на сервере (v8.2.0)"
          assert "_relaunch_clean_if_foreign_bundle()" in pathlib.Path("desktop_app.py").read_text(encoding="utf-8"), "Нет защиты запуска после обновления exe (v8.2.0)"
          assert "function absorbTankChange" in h and "ensureOutputIntegrity" in h, "Нет цепочки остатков и проверки перед печатью (v8.2.0)"
          assert "def parse_fines_text" in pathlib.Path("server.py").read_text(encoding="utf-8") and "renderFines" in h, "Нет раздела «Штрафы» (v8.2.0)"
          assert "function fitRefuelWindows" in h and "function preRefuelKm" in h, "Нет проверки заправки в момент чека (v8.2.0)"
          _d = pathlib.Path("desktop_app.py").read_text(encoding="utf-8")
          assert "def _install_and_handoff" in _d and "--finish-update" in _d and "--finish-update" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Нет установки в одно место и обновления без батника (v8.2.1)"
          assert "CSP_PAGE" in pathlib.Path("server.py").read_text(encoding="utf-8") and "pbkdf2_sha256" in pathlib.Path("server.py").read_text(encoding="utf-8"), "Нет защиты данных (v8.2.0)"
          # v8.2.0: защита от повторения утечки 17.11 — в стартовой базе и шаблоне не должно быть реальных данных
          import json as _j, zipfile as _z
          for _f in ("data/app_data.json", "data/putevka_db.json"):
              _d = _j.loads(pathlib.Path(_f).read_text(encoding="utf-8"))
              assert not _d.get("profiles") and not _d.get("users") and not _d.get("savedDocuments"), f"В {_f} есть профили/пользователи/документы — реальные данные в публичный выпуск не попадают!"
          _xml = b"".join(_z.ZipFile("templates_xls/template_0345001.xlsx").read(n) for n in _z.ZipFile("templates_xls/template_0345001.xlsx").namelist() if n.endswith(".xml"))
          assert not re.search(rb"\d{3}-\d{3}-\d{3}[ -]\d{2}", _xml), "В шаблоне бланка найден номер, похожий на СНИЛС"
          assert "RAW_INIT" in h and '"profiles": []' in h and '"users": []' in h, "В странице (RAW_INIT) есть профили или пользователи"

          # 3. Сборка десктоп-приложения для Windows
          # v8.2.1: значок и описание файла программы (видны в Проводнике, на панели задач и в диспетчере задач)
          assert pathlib.Path("putevka.ico").exists(), "Нет значка putevka.ico"
          _v = tuple(int(x) for x in pathlib.Path("version.txt").read_text(encoding="utf-8").strip().split(".")) + (0,)
          _vs = ".".join(str(x) for x in _v[:3])
          pathlib.Path("file_version_info.txt").write_text(
              "VSVersionInfo(ffi=FixedFileInfo(filevers=%r, prodvers=%r, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),\n"
              "kids=[StringFileInfo([StringTable('041904B0', [StringStruct('CompanyName', 'АСУ ПУТЁВКА'), StringStruct('FileDescription', 'Путёвка — путевые листы'), "
              "StringStruct('FileVersion', %r), StringStruct('InternalName', 'Putevka'), StringStruct('OriginalFilename', 'Putevka.exe'), "
              "StringStruct('ProductName', 'Путёвка'), StringStruct('ProductVersion', %r)])]), VarFileInfo([VarStruct('Translation', [0x419, 1200])])])\n"
              % (_v[:4], _v[:4], _vs, _vs), encoding="utf-8")
          subprocess.run(["pyinstaller", "--noconfirm", "--clean", "--onefile", "--name", "Putevka", "--icon", "putevka.ico", "--version-file", "file_version_info.txt", "--add-data", "static;static", "--add-data", "data;data", "--add-data", "version.txt;.", "desktop_app.py"], check=True)

          # 4. Формирование архивов релиза
          z1 = zipfile.ZipFile("putevka_windows_desktop_app_v8_2_1.zip", "w", zipfile.ZIP_DEFLATED)
          for f in ["dist/Putevka.exe", "update.ps1", "update.sh", "version.txt"]:
              if os.path.exists(f):
                  z1.write(f, os.path.basename(f))
          z1.close()

          srv_files = ["server.py", "desktop_app.py", "version.txt", "requirements.txt", "Dockerfile", "docker-compose.yml", "setup_and_run.sh", "update_on_server.sh", "update.sh", "update.ps1", "static/index.html", "data/app_data.json", "data/putevka_db.json", "templates_xls/template_0345001.xlsx"]
          z2 = zipfile.ZipFile("putevka_server_v8_2_1.zip", "w", zipfile.ZIP_DEFLATED)
          for f in srv_files:
              if os.path.exists(f):
                  z2.write(f, f)
          z2.close()

          os.makedirs("releases", exist_ok=True)
          shutil.copy2("putevka_server_v8_2_1.zip", "releases/putevka_server_v8_2_1.zip")
          shutil.copy2("putevka_windows_desktop_app_v8_2_1.zip", "releases/putevka_windows_desktop_app_v8_2_1.zip")

          # 5. Синхронизация собранных пакетов обратно в репозиторий
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", "Sync v8.2.1 release packages [skip ci]"], check=False)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=False)

          # 6. Публикация релиза GitHub
          subprocess.run(["gh", "release", "delete", "v8.2.1", "--yes", "--cleanup-tag"], check=False)
          subprocess.run(["gh", "release", "create", "v8.2.1", "dist/Putevka.exe", "putevka_windows_desktop_app_v8_2_1.zip", "putevka_server_v8_2_1.zip", "update.ps1", "update.sh", "setup_and_run.sh", "--title", "АСУ ПУТЁВКА v8.2.1 — установка со значком на рабочем столе и надёжное обновление Windows-версии", "--notes", "Windows-версия: программа сама ставится в одно место (%LOCALAPPDATA%\\Programs\\Putevka) вместе с рабочей базой и создаёт ярлык «Путёвка» с фирменным значком на рабочем столе и в «Пуске»; старые ярлыки ведут туда же. Обновление закрывает прежнюю версию по номеру процесса (а не по имени файла), новый exe сам встаёт на место старого (без батника), старая версия в фоне больше не перехватывает запуск, после обновления не открывается второе окно. У exe — значок и описание. Переход со старых версий: если кнопка «Обновить» не сработала — один раз скачайте Putevka.exe с этой страницы и запустите (откуда угодно): программа найдёт и перенесёт базу сама.", "--latest"], check=True)
